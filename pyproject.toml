[project]
name = "dancify"
version = "0.1.0"
description = "Real-time Dancify synchronization and scoring subsystem"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.16.5",
  "flask==3.1.2",
  "flask-socketio==5.5.1",
  "flask-sqlalchemy==3.1.1",
  "gunicorn==23.0.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "python-dotenv==1.1.1",
  "python-socketio[asyncio-client]==5.13.0",
  "simple-websocket==1.1.0",
  "sqlalchemy==2.0.43",
  "textual==5.3.0",
  "typer==0.16.0",
]

[project.scripts]
dancify-client = "dancify.terminal.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pyright==1.1.411",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dancify"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=dancify --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dancify"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unreachable = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
reportMissingTypeStubs = false
reportUnusedFunction = false
